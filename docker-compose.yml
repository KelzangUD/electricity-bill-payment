version: "3.9"

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: electricity-bill-payment
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    command: npm start
